<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMate Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
    }
    .btn {
      background: #00bfa6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn:hover {
      background: #009e8a;
    }
    .container {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .card h2 {
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    input, textarea {
      width: 100%;
      background: #2a2a2a;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      resize: none;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #2a2a2a;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li button {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .mode-toggle {
      background: #2a2a2a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: white;
    }
    .light-mode {
      background-color: #fafafa;
      color: #111;
    }
    .light-mode .card {
      background: #fff;
      color: #111;
    }
    .light-mode input, .light-mode textarea, .light-mode li {
      background: #f0f0f0;
      color: #111;
    }
    .light-mode header {
      background: #fff;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎯 StudyMate Dashboard</h1>
    <div>
      <button id="toggleMode" class="mode-toggle">🌙</button>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>📘 Assignments</h2>
      <input type="text" id="assignmentInput" placeholder="Add new assignment..." />
      <button id="addAssignment" class="btn">Add</button>
      <ul id="assignmentList"></ul>
    </div>

    <div class="card">
      <h2>🕒 Reminders</h2>
      <input type="text" id="reminderInput" placeholder="Add reminder..." />
      <button id="addReminder" class="btn">Add</button>
      <ul id="reminderList"></ul>
    </div>

    <div class="card">
      <h2>📔 Diary</h2>
      <textarea id="diaryInput" rows="4" placeholder="Write something..."></textarea>
      <button id="saveDiary" class="btn">Save</button>
      <ul id="diaryList"></ul>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
