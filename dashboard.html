<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 StudyMate Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #121212;
      color: #f1f1f1;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1f1f1f;
      text-align: center;
      padding: 16px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h3 { color: #a6baff; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #2b2b2b;
      border: none;
      border-radius: 8px;
      color: #f1f1f1;
    }
    button {
      padding: 10px 15px;
      background: #3a86ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #5aa0ff; }
    .assignment {
      background: #222;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }
    .logout-btn {
      background: #ef233c;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎯 StudyMate Dashboard</h1>
  </header>

  <main>
    <h3>Welcome to your private dashboard 🧠</h3>
    <p>Manage your assignments and reminders here.</p>

    <h4>Add Assignment 📚</h4>
    <input type="text" id="taskTitle" placeholder="Assignment title..." />
    <textarea id="taskDetails" placeholder="Details or deadline..."></textarea>
    <button onclick="saveAssignment()">💾 Save Assignment</button>

    <h4>Your Assignments 📝</h4>
    <div id="assignmentsList">Loading...</div>

    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </main>

  <!-- ✅ Script -->
  <script type="module" src="./script.js"></script>
</body>
</html>
